{% extends "base.html" %}
{% block title %}Events · Hookline{% endblock %}

{% block content %}
<h1>Event log</h1>

<form class="filters" method="get" action="/dashboard/events">
  <input name="event_type" value="{{ event_type }}" placeholder="filter by event type">
  <button type="submit">Filter</button>
  {% if event_type %}<a class="link" href="/dashboard/events">clear</a>{% endif %}
</form>

<table>
  <thead>
    <tr><th>type</th><th>when</th><th>fan-out</th><th>idempotency key</th><th></th></tr>
  </thead>
  <tbody>
    {% include "partials/event_rows.html" %}
  </tbody>
</table>

{% include "partials/pager.html" %}
{% endblock %}
