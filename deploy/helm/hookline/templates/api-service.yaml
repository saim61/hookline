apiVersion: v1
kind: Service
metadata:
  name: {{ include "hookline.fullname" . }}-api
  labels:
    {{- include "hookline.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "hookline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
{{/*
A headless Service for the worker. It exists only so Prometheus can discover the pods: the
worker is never addressed by anything, so it has no cluster IP and no load balancing. Without
this there is nothing for a ServiceMonitor to select and the worker's metrics are invisible.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hookline.fullname" . }}-worker-metrics
  labels:
    {{- include "hookline.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    {{- include "hookline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
