{{/*
Only rendered when the chart is managing the Secret. With `secrets.existingSecret` set, the
Secret is created out of band - by an operator, a sealed-secret, or an external-secrets
controller - and Helm never sees the credentials at all. That is what you want anywhere real:
values passed on the command line end up in the release object, in shell history, and in
whatever CI logs the command.
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hookline.fullname" . }}-secrets
  labels:
    {{- include "hookline.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
{{- end }}
