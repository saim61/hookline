services:
  db:
    image: postgres:17-alpine
    container_name: hookline-db
    environment:
      POSTGRES_USER: hookline
      POSTGRES_PASSWORD: hookline
      POSTGRES_DB: hookline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: